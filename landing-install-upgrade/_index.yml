indexpage:
  title: 安裝、升級和 Hotfix StorageGRID
  summary: StorageGRID 系統由獨立的硬體型節點和軟體型節點組成。首先，您需要為每個應用裝置節點安裝硬體，並設定每個 Linux 或 VMware
    主機。然後，在每個應用裝置或軟體主機上安裝 StorageGRID 軟體，並將這些節點連接成一個網格。
