indexpage:
  title: StorageGRID 12.0 軟體文件
  summary: NetApp StorageGRID 是一套軟體定義物件儲存套件，支援公有雲、私有雲和混合多雲環境中的各種使用案例。StorageGRID 提供對
    Amazon S3 API 的原生支援，並提供業界領先的創新功能，例如自動化生命週期管理，能夠長期且經濟高效地儲存、保護及保存非結構化資料。
